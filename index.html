<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Blocks</title>
<meta name="theme-color" content="#36508f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Blocks">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root {
  --gap: 2px;
  --pad: 5px;
  /* The script replaces this with the real screen height; see fitScreen(). */
  --app-h: 100dvh;
  --board: min(100vw - 32px, var(--app-h) - 460px, 560px);
  --cell: calc((var(--board) - 2 * var(--pad) - 7 * var(--gap)) / 8);
  --ease: cubic-bezier(.2, 0, 0, 1);
}

*, *::before, *::after { box-sizing: border-box; }

/* One flat colour, set on the page itself. iOS paints this same colour into
   any part of the screen the page doesn't reach, so no seam can show. */
html {
  height: var(--app-h);
  overflow: hidden;
  overscroll-behavior: none;
  background: #36508f;
}

body {
  position: relative;
  height: 100%;
  margin: 0;
  overflow: hidden;
  font-family: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", system-ui, -apple-system, sans-serif;
  color: #fff;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
}

/* The extra space at the top keeps the header below the band that iOS blurs
   under the status bar, which reaches about 36px past the safe area. */
.app {
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: calc(env(safe-area-inset-top, 0px) + 40px) 16px calc(env(safe-area-inset-bottom, 0px) + 10px);
}

/* ---------- header ---------- */

.top {
  width: var(--board);
  height: 48px;
  flex: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.best {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 30px;
  font-weight: 800;
  color: #f8b62d;
  font-variant-numeric: tabular-nums;
}
.best svg { width: 38px; height: 30px; margin-top: -4px; }

.icon-btn {
  width: 48px;
  height: 48px;
  margin-right: -6px;
  padding: 0;
  border: 0;
  background: none;
  color: #a4d4f6;
  display: grid;
  place-items: center;
  transition: transform .12s var(--ease);
}
.icon-btn:active { transform: scale(.96); }
.icon-btn svg { width: 38px; height: 38px; }

.score-wrap {
  flex: 1 1 0;
  min-height: 64px;
  display: grid;
  place-items: center;
}
.score {
  font-size: min(17vw, 74px);
  font-weight: 800;
  line-height: 1;
  font-variant-numeric: tabular-nums;
  text-shadow: 0 3px 0 rgba(20, 30, 70, .25);
}

/* ---------- board ---------- */

.board-wrap {
  position: relative;
  width: var(--board);
  height: var(--board);
  flex: none;
}

.board {
  width: 100%;
  height: 100%;
  padding: var(--pad);
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  grid-template-rows: repeat(8, 1fr);
  gap: var(--gap);
  background: #141b3c;
  border-radius: 8px;
  box-shadow: 0 0 0 3px #2a3a73, 0 10px 24px rgba(12, 20, 50, .3);
}

.cell {
  --s: var(--cell);
  position: relative;
  background: #1c2652;
  border-radius: 3px;
}

/* A block: four bevelled edges around a flat face. --glow lightens the whole
   block; it is done with colour rather than a filter, which iPhones draw slowly. */
.b {
  --face: color-mix(in srgb, var(--base), #fff var(--glow, 0%));
  --hi: color-mix(in srgb, var(--face), #fff 45%);
  --lo: color-mix(in srgb, var(--face), #000 40%);
  --lt: color-mix(in srgb, var(--face), #fff 16%);
  --rt: color-mix(in srgb, var(--face), #000 20%);
  background: var(--face);
  border-style: solid;
  border-width: calc(var(--s) * .15);
  border-color: var(--hi) var(--rt) var(--lo) var(--lt);
  border-radius: calc(var(--s) * .07);
}
.c1 { --base: #d8403b; }
.c2 { --base: #f0872a; }
.c3 { --base: #f3b830; }
.c4 { --base: #47c06a; }
.c5 { --base: #3dbfe0; }
.c6 { --base: #4d70e6; }
.c7 { --base: #9a57d0; }

.cell.ghost { opacity: .45; }
.cell.hl { --glow: 32%; }

.fx {
  --glow: 60%;
  position: absolute;
  inset: 0;
  animation: clear .36s cubic-bezier(.4, 0, .9, .4) both;
  animation-delay: var(--d, 0ms);
}
@keyframes clear {
  0%   { transform: scale(1); opacity: 1; }
  35%  { transform: scale(1.12); opacity: 1; }
  100% { transform: scale(.1) rotate(14deg); opacity: 0; }
}

.fxlayer {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.float {
  position: absolute;
  translate: -50% -50%;
  font-size: 30px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  text-shadow: 0 2px 0 rgba(15, 22, 55, .55), 0 0 12px rgba(15, 22, 55, .5);
  animation: floatup .9s var(--ease) both;
}
@keyframes floatup {
  0%   { transform: translateY(8px) scale(.6); opacity: 0; }
  20%  { transform: translateY(0) scale(1); opacity: 1; }
  70%  { opacity: 1; }
  100% { transform: translateY(-34px) scale(1); opacity: 0; }
}

.banner {
  position: absolute;
  left: 7%;
  top: 1%;
  font-size: min(13.5vw, 60px);
  font-weight: 900;
  font-style: italic;
  line-height: 1;
  white-space: nowrap;
  color: #e6f5ff;
  -webkit-text-stroke: 9px #3d6fe6;
  paint-order: stroke fill;
  text-shadow: 0 5px 0 #2848ad, 0 8px 14px rgba(10, 18, 50, .45);
  transform-origin: 30% 60%;
  animation: banner 1.2s var(--ease) both;
}
.banner small { font-size: .62em; margin-left: .18em; }
@keyframes banner {
  0%   { transform: rotate(-5deg) scale(.4); opacity: 0; }
  14%  { transform: rotate(-5deg) scale(1.1); opacity: 1; }
  24%  { transform: rotate(-5deg) scale(1); }
  76%  { transform: rotate(-5deg) scale(1); opacity: 1; }
  100% { transform: rotate(-5deg) translateY(-10px) scale(1); opacity: 0; }
}

/* ---------- pieces ---------- */

.tray {
  flex: 2.2 1 0;
  width: 100%;
  max-width: calc(var(--board) + 32px);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
}
.slot {
  --s: calc(var(--cell) * .46);
  --g: 1.5px;
  display: grid;
  place-items: center;
  touch-action: none;
}

.piece {
  display: grid;
  grid-auto-rows: var(--s);
  gap: var(--g);
}
.slot .piece { transition: opacity .2s; }
.slot .b { transition: background-color .2s, border-color .2s; }
.slot.nofit .piece { opacity: .6; }
.slot.nofit .b { --base: #66709a; }
.deal { animation: deal .28s var(--ease) backwards; }
@keyframes deal {
  from { transform: scale(.5); opacity: 0; }
}

/* The outer element follows the finger exactly. Only the inner one animates,
   so the pop on pick-up never makes the shape lag behind the finger. */
.drag {
  position: absolute;
  left: 0;
  top: 0;
  z-index: 5;
  pointer-events: none;
  will-change: transform;
}
.drag-inner {
  transform-origin: 50% 100%;
  transition: transform .09s var(--ease);
}

/* ---------- overlays ---------- */

.overlay {
  position: absolute;
  inset: 0;
  z-index: 10;
  display: grid;
  place-items: center;
  background: rgba(16, 24, 58, .74);
  /* Fully hidden when closed, so it costs nothing while the game is being played. */
  visibility: hidden;
  opacity: 0;
  transition: opacity .22s ease, visibility 0s linear .22s;
}
.overlay.show { visibility: visible; opacity: 1; transition-delay: 0s; }

.card {
  width: min(320px, 82vw);
  padding: 28px 22px 22px;
  border-radius: 26px;
  background: #2c4180;
  box-shadow: 0 0 0 1px rgba(255, 255, 255, .08) inset, 0 24px 48px rgba(8, 14, 40, .5);
  text-align: center;
  transform: translateY(10px) scale(.96);
  transition: transform .3s var(--ease);
}
.overlay.show .card { transform: none; }

.card h2 {
  margin: 0;
  font-size: 30px;
  font-weight: 800;
  text-wrap: balance;
}
.card .sub {
  margin: 6px 0 0;
  font-size: 16px;
  font-weight: 600;
  color: #a9bce8;
  text-wrap: balance;
}
.final {
  margin-top: 18px;
  font-size: 64px;
  font-weight: 800;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.card .best {
  justify-content: center;
  margin-top: 10px;
  font-size: 24px;
}
.card .best svg { width: 30px; height: 24px; }

.btn {
  display: block;
  width: 100%;
  height: 56px;
  margin-top: 22px;
  border: 0;
  border-radius: 16px;
  font: inherit;
  font-size: 21px;
  font-weight: 800;
  color: #4a3200;
  background: #f8b62d;
  box-shadow: 0 5px 0 #b97d0c;
  transition: transform .12s var(--ease);
}
.btn:active { transform: scale(.96); }
.btn.quiet {
  margin-top: 16px;
  color: #fff;
  background: rgba(255, 255, 255, .12);
  box-shadow: none;
}
.version {
  margin: 16px 0 -6px;
  font-size: 13px;
  font-weight: 600;
  color: #8fa3d6;
}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="best" aria-label="Best score">
      <svg viewBox="0 0 38 30" aria-hidden="true">
        <path d="M4 9.5 11.5 15 19 4l7.5 11L34 9.5 31 23H7z" fill="#f8b62d" stroke="#f8b62d" stroke-width="3" stroke-linejoin="round"/>
        <circle cx="4" cy="8.5" r="3" fill="#f8b62d"/><circle cx="19" cy="3.5" r="3" fill="#f8b62d"/><circle cx="34" cy="8.5" r="3" fill="#f8b62d"/>
        <rect x="6" y="25" width="26" height="4" rx="2" fill="#f8b62d"/>
      </svg>
      <span id="best">0</span>
    </div>
    <button class="icon-btn" id="gear" aria-label="Pause">
      <svg viewBox="-12 -12 24 24" aria-hidden="true">
        <g fill="currentColor">
          <rect x="-2.3" y="-11.6" width="4.6" height="6" rx="1.2"/>
          <rect x="-2.3" y="-11.6" width="4.6" height="6" rx="1.2" transform="rotate(45)"/>
          <rect x="-2.3" y="-11.6" width="4.6" height="6" rx="1.2" transform="rotate(90)"/>
          <rect x="-2.3" y="-11.6" width="4.6" height="6" rx="1.2" transform="rotate(135)"/>
          <rect x="-2.3" y="-11.6" width="4.6" height="6" rx="1.2" transform="rotate(180)"/>
          <rect x="-2.3" y="-11.6" width="4.6" height="6" rx="1.2" transform="rotate(225)"/>
          <rect x="-2.3" y="-11.6" width="4.6" height="6" rx="1.2" transform="rotate(270)"/>
          <rect x="-2.3" y="-11.6" width="4.6" height="6" rx="1.2" transform="rotate(315)"/>
        </g>
        <circle r="6" fill="none" stroke="currentColor" stroke-width="4.6"/>
      </svg>
    </button>
  </header>

  <div class="score-wrap"><div class="score" id="score">0</div></div>

  <div class="board-wrap">
    <div class="board" id="board"></div>
    <div class="fxlayer" id="fx"></div>
  </div>

  <div class="tray">
    <div class="slot"></div>
    <div class="slot"></div>
    <div class="slot"></div>
  </div>
</div>

<div class="overlay" id="over">
  <div class="card">
    <h2>Game over</h2>
    <p class="sub" id="overSub"></p>
    <div class="final" id="finalScore">0</div>
    <div class="best">
      <svg viewBox="0 0 38 30" aria-hidden="true">
        <path d="M4 9.5 11.5 15 19 4l7.5 11L34 9.5 31 23H7z" fill="#f8b62d" stroke="#f8b62d" stroke-width="3" stroke-linejoin="round"/>
        <circle cx="4" cy="8.5" r="3" fill="#f8b62d"/><circle cx="19" cy="3.5" r="3" fill="#f8b62d"/><circle cx="34" cy="8.5" r="3" fill="#f8b62d"/>
        <rect x="6" y="25" width="26" height="4" rx="2" fill="#f8b62d"/>
      </svg>
      <span id="finalBest">0</span>
    </div>
    <button class="btn" id="again">Play again</button>
  </div>
</div>

<div class="overlay" id="pause">
  <div class="card">
    <h2>Paused</h2>
    <button class="btn" id="resume">Resume</button>
    <button class="btn quiet" id="restart">New game</button>
    <p class="version">Version 4</p>
  </div>
</div>

<script>
(() => {
'use strict';

const N = 8;
const COLORS = 7;
const STATE_KEY = 'blocks.state.v1';
const BEST_KEY = 'blocks.best.v1';

// [weight, shape]. Every rotation and mirror image of each shape is in play.
const BASES = [
  [3, ['X']],
  [4, ['XX']],
  [5, ['XXX']],
  [4, ['XXXX']],
  [3, ['XXXXX']],
  [5, ['XX', 'XX']],
  [3, ['XXX', 'XXX', 'XXX']],
  [4, ['XXX', 'XXX']],
  [6, ['XX', 'X.']],
  [6, ['X.', 'X.', 'XX']],
  [3, ['X..', 'X..', 'XXX']],
  [5, ['XXX', '.X.']],
  [4, ['XX.', '.XX']],
  [3, ['X.', 'XX', 'XX']],
];

const rotate = m => {
  const out = [];
  for (let c = 0; c < m[0].length; c++) {
    let s = '';
    for (let r = m.length - 1; r >= 0; r--) s += m[r][c];
    out.push(s);
  }
  return out;
};
const mirror = m => m.map(row => [...row].reverse().join(''));
const variants = m => {
  const seen = new Map();
  let a = m, b = mirror(m);
  for (let i = 0; i < 4; i++) {
    seen.set(a.join('/'), a);
    seen.set(b.join('/'), b);
    a = rotate(a);
    b = rotate(b);
  }
  return [...seen.values()];
};

const FAMILIES = BASES.map(([weight, m]) => ({ weight, shapes: variants(m) }));
const TOTAL_WEIGHT = FAMILIES.reduce((sum, f) => sum + f.weight, 0);

function randomPiece() {
  let x = Math.random() * TOTAL_WEIGHT;
  let family = FAMILIES[FAMILIES.length - 1];
  for (const f of FAMILIES) {
    if ((x -= f.weight) < 0) { family = f; break; }
  }
  return {
    m: family.shapes[Math.random() * family.shapes.length | 0],
    color: 1 + (Math.random() * COLORS | 0),
  };
}

const cellsOf = m => {
  const out = [];
  m.forEach((row, r) => {
    for (let c = 0; c < row.length; c++) if (row[c] === 'X') out.push([r, c]);
  });
  return out;
};

/* ---------- state ---------- */

let board, tray, score, best = 0, combo, since, over = false, paused = false;

function canPlace(m, r0, c0) {
  if (r0 < 0 || c0 < 0 || r0 + m.length > N || c0 + m[0].length > N) return false;
  for (let r = 0; r < m.length; r++)
    for (let c = 0; c < m[0].length; c++)
      if (m[r][c] === 'X' && board[(r0 + r) * N + c0 + c]) return false;
  return true;
}

function fitsAnywhere(m) {
  for (let r = 0; r <= N - m.length; r++)
    for (let c = 0; c <= N - m[0].length; c++)
      if (canPlace(m, r, c)) return true;
  return false;
}

const isStuck = () => !tray.some(p => p && fitsAnywhere(p.m));

// Rows and columns that are full, counting `extra` cells as filled.
function fullLines(extra) {
  const filled = k => board[k] || (extra && extra.has(k));
  const rows = [], cols = [];
  for (let i = 0; i < N; i++) {
    let row = true, col = true;
    for (let j = 0; j < N; j++) {
      if (!filled(i * N + j)) row = false;
      if (!filled(j * N + i)) col = false;
    }
    if (row) rows.push(i);
    if (col) cols.push(i);
  }
  return { rows, cols };
}

function save() {
  try {
    localStorage.setItem(STATE_KEY, JSON.stringify({ board, tray, score, combo, since }));
    localStorage.setItem(BEST_KEY, String(best));
  } catch {}
}

const validPiece = p => p === null || (
  p && Number.isInteger(p.color) && p.color >= 1 && p.color <= COLORS &&
  Array.isArray(p.m) && p.m.length >= 1 && p.m.length <= 5 &&
  p.m.every(row => typeof row === 'string' && /^[X.]{1,5}$/.test(row) && row.length === p.m[0].length)
);

function load() {
  try {
    best = Math.max(0, parseInt(localStorage.getItem(BEST_KEY), 10) || 0);
    const s = JSON.parse(localStorage.getItem(STATE_KEY) || 'null');
    if (
      s && Array.isArray(s.board) && s.board.length === N * N &&
      s.board.every(v => Number.isInteger(v) && v >= 0 && v <= COLORS) &&
      Array.isArray(s.tray) && s.tray.length === 3 && s.tray.every(validPiece) && s.tray.some(Boolean)
    ) {
      board = s.board;
      tray = s.tray;
      score = Math.max(0, s.score | 0);
      combo = Math.max(0, s.combo | 0);
      since = Math.max(0, s.since | 0);
      return true;
    }
  } catch {}
  return false;
}

function reset() {
  board = new Array(N * N).fill(0);
  tray = [randomPiece(), randomPiece(), randomPiece()];
  score = 0;
  combo = 0;
  since = 0;
}

/* ---------- rendering ---------- */

const $ = id => document.getElementById(id);
const boardEl = $('board'), fxEl = $('fx'), scoreEl = $('score'), bestEl = $('best');
const slots = [...document.querySelectorAll('.slot')];
const cells = [], cellClass = [];

for (let i = 0; i < N * N; i++) {
  const el = document.createElement('div');
  el.className = 'cell';
  boardEl.appendChild(el);
  cells.push(el);
  cellClass.push('cell');
}

// preview: { color, ghost: Set of cells the held piece would fill, lines: Set of cells that would clear }
function paint(preview) {
  for (let i = 0; i < N * N; i++) {
    const v = board[i];
    let c = v ? 'cell b c' + v : 'cell';
    if (preview) {
      const ghost = preview.ghost.has(i);
      if (preview.lines.has(i) && (v || ghost)) c = 'cell b hl c' + preview.color;
      else if (ghost) c = 'cell b ghost c' + preview.color;
    }
    if (cellClass[i] !== c) cells[i].className = cellClass[i] = c;
  }
}

function buildPiece(p) {
  const el = document.createElement('div');
  el.className = 'piece';
  el.style.gridTemplateColumns = `repeat(${p.m[0].length}, var(--s))`;
  for (const row of p.m) {
    for (const ch of row) {
      const d = document.createElement('div');
      if (ch === 'X') d.className = 'b c' + p.color;
      el.appendChild(d);
    }
  }
  return el;
}

function renderTray(animate) {
  slots.forEach((slot, i) => {
    const p = tray[i];
    if (slot._piece !== p) {
      slot._piece = p;
      slot.replaceChildren();
      if (p) {
        const el = buildPiece(p);
        if (animate) {
          el.classList.add('deal');
          el.style.animationDelay = i * 60 + 'ms';
        }
        slot.appendChild(el);
      }
    }
    slot.classList.toggle('nofit', !!p && !fitsAnywhere(p.m));
  });
}

let shown = 0, scoreRaf = 0;
function showScore(animate) {
  bestEl.textContent = best;
  cancelAnimationFrame(scoreRaf);
  if (!animate) {
    scoreEl.textContent = shown = score;
    return;
  }
  const from = shown, to = score, start = performance.now();
  const dur = Math.min(600, 160 + (to - from) * 4);
  const step = now => {
    const t = Math.min(1, (now - start) / dur);
    shown = Math.round(from + (to - from) * (1 - (1 - t) ** 3));
    scoreEl.textContent = shown;
    if (t < 1) scoreRaf = requestAnimationFrame(step);
  };
  scoreRaf = requestAnimationFrame(step);
}

/* ---------- effects ---------- */

function fxClear(cleared) {
  for (const [k, order] of cleared) {
    const el = document.createElement('div');
    el.className = 'fx b c' + board[k];
    el.style.setProperty('--d', order * 22 + 'ms');
    el.addEventListener('animationend', () => el.remove());
    cells[k].appendChild(el);
  }
}

function fxFloat(text, keys) {
  const wrap = fxEl.getBoundingClientRect();
  let x = 0, y = 0;
  for (const k of keys) {
    const r = cells[k].getBoundingClientRect();
    x += r.left + r.width / 2;
    y += r.top + r.height / 2;
  }
  const el = document.createElement('div');
  el.className = 'float';
  el.textContent = text;
  el.style.left = x / keys.length - wrap.left + 'px';
  el.style.top = y / keys.length - wrap.top + 'px';
  el.addEventListener('animationend', () => el.remove());
  fxEl.appendChild(el);
}

function fxBanner(text, detail) {
  fxEl.querySelector('.banner')?.remove();
  const el = document.createElement('div');
  el.className = 'banner';
  el.textContent = text;
  if (detail) {
    const small = document.createElement('small');
    small.textContent = detail;
    el.appendChild(small);
  }
  el.addEventListener('animationend', () => el.remove());
  fxEl.appendChild(el);
}

/* ---------- moves ---------- */

function place(i, r0, c0) {
  const p = tray[i];
  const placed = cellsOf(p.m).map(([r, c]) => (r0 + r) * N + c0 + c);
  for (const k of placed) board[k] = p.color;
  tray[i] = null;

  let gained = placed.length;
  let clearPoints = 0;
  let perfect = false;
  const cleared = new Map();
  const { rows, cols } = fullLines();
  const lines = rows.length + cols.length;

  if (lines) {
    combo++;
    since = 0;
    clearPoints = 10 * lines * (lines + 1) / 2 * combo;
    for (const r of rows) for (let c = 0; c < N; c++) cleared.set(r * N + c, c);
    for (const c of cols) for (let r = 0; r < N; r++) {
      const k = r * N + c;
      cleared.set(k, Math.min(cleared.get(k) ?? N, r));
    }
    fxClear(cleared);
    for (const k of cleared.keys()) board[k] = 0;
    if (board.every(v => !v)) {
      perfect = true;
      clearPoints += 300;
    }
    gained += clearPoints;
  } else if (++since >= 3) {
    // A combo survives up to two placements without a clear.
    combo = 0;
  }

  score += gained;
  if (score > best) best = score;

  const dealt = tray.every(t => !t);
  if (dealt) tray = [randomPiece(), randomPiece(), randomPiece()];
  over = isStuck();

  save();
  paint(null);
  renderTray(dealt);
  showScore(true);

  for (const k of placed) {
    if (!cleared.has(k)) {
      cells[k].animate([{ transform: 'scale(.86)' }, { transform: 'scale(1)' }], { duration: 150, easing: 'cubic-bezier(.2,0,0,1)' });
    }
  }
  if (lines) {
    fxFloat('+' + clearPoints, placed);
    if (perfect) fxBanner('Perfect!');
    else if (combo >= 2) fxBanner('Combo', '×' + combo);
  }
  if (over) setTimeout(showOver, 1000);
}

function showOver() {
  if (!over) return;
  $('overSub').textContent = score > 0 && score >= best ? 'New best score!' : 'No room left for these shapes';
  $('finalScore').textContent = score;
  $('finalBest').textContent = best;
  $('over').classList.add('show');
}

function newGame() {
  reset();
  over = false;
  save();
  paint(null);
  renderTray(true);
  showScore(false);
  $('over').classList.remove('show');
  setPaused(false);
}

function setPaused(on) {
  paused = on;
  $('pause').classList.toggle('show', on);
}

/* ---------- dragging ---------- */

let drag = null;

function metrics() {
  const a = cells[0].getBoundingClientRect(), b = cells[1].getBoundingClientRect();
  return { x: a.left, y: a.top, size: a.width, step: b.left - a.left };
}

// Nearest legal spot to where the piece is hovering, within most of a cell.
function snap(m, fr, fc) {
  const r0 = Math.round(fr), c0 = Math.round(fc);
  let found = null, dist = .85;
  for (let dr = -1; dr <= 1; dr++) {
    for (let dc = -1; dc <= 1; dc++) {
      const r = r0 + dr, c = c0 + dc;
      const d = Math.hypot(r - fr, c - fc);
      if (d < dist && canPlace(m, r, c)) {
        dist = d;
        found = [r, c];
      }
    }
  }
  return found;
}

function previewAt(p, r0, c0) {
  const ghost = new Set(cellsOf(p.m).map(([r, c]) => (r0 + r) * N + c0 + c));
  const { rows, cols } = fullLines(ghost);
  const lines = new Set();
  for (const r of rows) for (let c = 0; c < N; c++) lines.add(r * N + c);
  for (const c of cols) for (let r = 0; r < N; r++) lines.add(r * N + c);
  return { color: p.color, ghost, lines };
}

function startDrag(e, i) {
  const p = tray[i];
  if (drag || over || paused || !p) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  e.preventDefault();

  const slot = slots[i];
  if (slot._returning) {
    slot._returning.remove();
    slot._returning = null;
  }

  const mt = metrics();
  const gap = mt.step - mt.size;
  const W = p.m[0].length * mt.step - gap;
  const H = p.m.length * mt.step - gap;
  const src = slot.firstElementChild;
  const from = src.getBoundingClientRect();
  const ratio = from.width / W;

  const lift = e.pointerType === 'mouse' ? 30 : 70;
  const x = e.clientX - W / 2;
  const y = e.clientY - H - lift;

  const el = document.createElement('div');
  el.className = 'drag';
  el.style.transform = `translate3d(${x}px,${y}px,0)`;
  const inner = buildPiece(p);
  inner.classList.add('drag-inner');
  inner.style.setProperty('--s', mt.size + 'px');
  inner.style.setProperty('--g', gap + 'px');
  // Show it above the finger at once, a touch small, and let it pop to full size.
  // Animating it up from the tray made the pick-up feel late.
  inner.style.transition = 'none';
  inner.style.transform = 'scale(.88)';
  el.appendChild(inner);
  document.body.appendChild(el);
  src.style.visibility = 'hidden';
  inner.getBoundingClientRect();
  inner.style.transition = '';
  inner.style.transform = 'none';

  drag = { i, p, el, inner, mt, W, H, ratio, lift, id: e.pointerId, target: null, key: -2 };
  try { slot.setPointerCapture(e.pointerId); } catch {}
  moveDrag(e);
}

function moveDrag(e) {
  const d = drag;
  if (!d || e.pointerId !== d.id) return;
  const x = e.clientX - d.W / 2;
  const y = e.clientY - d.H - d.lift;
  d.el.style.transform = `translate3d(${x}px,${y}px,0)`;

  const t = snap(d.p.m, (y - d.mt.y) / d.mt.step, (x - d.mt.x) / d.mt.step);
  const key = t ? t[0] * N + t[1] : -1;
  if (key !== d.key) {
    d.key = key;
    d.target = t;
    paint(t ? previewAt(d.p, t[0], t[1]) : null);
  }
}

function endDrag(e, cancelled) {
  const d = drag;
  if (!d || e.pointerId !== d.id) return;
  drag = null;

  if (d.target && !cancelled) {
    d.el.remove();
    place(d.i, d.target[0], d.target[1]);
    return;
  }

  // No legal spot: send it back to the tray.
  paint(null);
  const slot = slots[d.i];
  const src = slot.firstElementChild;
  const to = src.getBoundingClientRect();
  d.el.style.transition = 'transform .2s cubic-bezier(.2,0,0,1)';
  d.inner.style.transitionDuration = '.2s';
  d.inner.style.transform = `scale(${d.ratio})`;
  d.el.style.transform = `translate3d(${to.left + to.width / 2 - d.W / 2}px,${to.bottom - d.H}px,0)`;
  slot._returning = d.el;
  setTimeout(() => {
    if (slot._returning === d.el) {
      slot._returning = null;
      src.style.visibility = '';
    }
    d.el.remove();
  }, 210);
}

slots.forEach((slot, i) => slot.addEventListener('pointerdown', e => startDrag(e, i)));
window.addEventListener('pointermove', moveDrag);
window.addEventListener('pointerup', e => endDrag(e, false));
window.addEventListener('pointercancel', e => endDrag(e, true));

/* ---------- controls ---------- */

$('gear').addEventListener('click', () => { if (!over && !drag) setPaused(true); });
$('resume').addEventListener('click', () => setPaused(false));
$('restart').addEventListener('click', newGame);
$('again').addEventListener('click', newGame);
$('pause').addEventListener('click', e => { if (e.target === e.currentTarget) setPaused(false); });

// Stop the page itself from scrolling, zooming or opening menus under the game.
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());

/* ---------- start ---------- */

// Installed on an iPhone, the page is told it is shorter than the screen it
// fills, by the height of the status bar, which leaves a dead strip along the
// bottom. Lay the game out to the real screen height there instead.
function fitScreen() {
  let h = window.innerHeight;
  const missing = screen.height - h;
  if (navigator.standalone === true && window.innerWidth < h && missing > 0 && missing < 120) h = screen.height;
  document.documentElement.style.setProperty('--app-h', h + 'px');
}
fitScreen();
window.addEventListener('resize', fitScreen);
window.addEventListener('orientationchange', fitScreen);
window.addEventListener('pageshow', fitScreen);

if (!load()) {
  reset();
  save();
}
over = isStuck();
paint(null);
renderTray(false);
showScore(false);
if (over) showOver();

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
})();
</script>
</body>
</html>
